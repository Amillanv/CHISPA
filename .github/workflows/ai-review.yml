name: OpenAI PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR Diff and Request Review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          git diff origin/$BASE_REF...HEAD | head -c 15000 > diff.txt

          # Skip if diff is empty
          if [ ! -s diff.txt ]; then
            echo "Diff is empty, skipping review."
            exit 0
          fi

          # Build JSON payload directly into a file
          jq -n \
            --arg model "gpt-4o-mini" \
            --arg system "You are a senior software engineer. Review this git diff for bugs, security vulnerabilities, and performance issues. Be concise and use bullet points. Do not comment on minor formatting." \
            --rawfile diff diff.txt \
            '{
              model: $model,
              messages: [
                {role: "system", content: $system},
                {role: "user", content: $diff}
              ]
            }' > payload.json

          # Call OpenAI API using the file
          HTTP_STATUS=$(curl -s -w "%{http_code}" -o response.json https://openai.com \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -d @payload.json)

          # Check for HTTP errors before running jq
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "OpenAI API failed with status $HTTP_STATUS:"
            cat response.json
            exit 1
          fi

          REVIEW_TEXT=$(jq -r '.choices[0].message.content // "Error parsing review."' response.json)

          # Post comment to the Pull Request
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "### 🤖 AI Code Review
          $REVIEW_TEXT"
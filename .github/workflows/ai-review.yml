name: OpenAI PR Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get PR Diff and Request Review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          git diff origin/$BASE_REF...HEAD > diff.txt
          
          # Truncate diff to avoid token limits on massive PRs
          DIFF_CONTENT=$(head -c 15000 diff.txt)

          # Build JSON payload safely with jq
          PAYLOAD=$(jq -n \
            --arg model "gpt-4.1-mini" \
            --arg instructions "You are a senior software engineer. Review this git diff for bugs, security vulnerabilities, performance issues, and wrong claims. Be concise and use bullet points. Do not comment on minor formatting." \
            --arg input "$DIFF_CONTENT" \
            '{model: $model, instructions: $instructions, input: $input}')

          # Call OpenAI API
          RESPONSE=$(curl -s https://openai.com \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -d "$PAYLOAD")

          REVIEW_TEXT=$(echo "$RESPONSE" | jq -r '.output[0].content[0].text // "Error generating review."')

          # Post comment to the Pull Request
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body "### 🤖 AI Code Review
          $REVIEW_TEXT"
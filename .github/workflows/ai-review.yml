name: OpenAI PR Review

# A second reviewer for each pull request. It sends the diff, the rules, the documents and the
# result summary to an OpenAI model, and writes one comment on the pull request.
# It needs the repository secret OPENAI_API_KEY. The variable OPENAI_REVIEW_MODEL selects the model.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Review the pull request
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          BASE_REF: ${{ github.base_ref }}
          MODEL: ${{ vars.OPENAI_REVIEW_MODEL || 'gpt-6.2-astra' }}
          # The largest number of characters of the diff and of each document that we send.
          MAX_DIFF: 120000
          MAX_DOC: 60000
        run: |
          set -euo pipefail

          # A pull request from a fork has no secret. Stop with no error.
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "OPENAI_API_KEY is not set. No review."
            exit 0
          fi

          # The diff has no result files and no test samples: they are large and code makes them.
          git diff --stat "origin/$BASE_REF...HEAD" > files.txt
          git diff "origin/$BASE_REF...HEAD" -- . \
            ':(exclude)results' ':(exclude)tests/samples' > full_diff.txt
          if [ ! -s full_diff.txt ]; then
            echo "The diff is empty. No review."
            exit 0
          fi
          head -c "$MAX_DIFF" full_diff.txt > diff.txt
          if [ "$(wc -c < full_diff.txt)" -gt "$MAX_DIFF" ]; then
            printf '\n[The diff was cut at %s characters.]\n' "$MAX_DIFF" >> diff.txt
          fi

          # The prompt and the program come only from the base branch. Thus a pull request
          # cannot change its own review. If the base branch does not have them, there is no review.
          if ! git show "origin/$BASE_REF:.github/review-prompt.txt" > prompt.txt 2>/dev/null \
             || ! git show "origin/$BASE_REF:.github/review.py" > review.py 2>/dev/null; then
            echo "The base branch has no review files. No review."
            exit 0
          fi

          # Each document is one part of the message, between marks.
          : > context.txt
          for part in "RULES:CLAUDE.md" "README:README.md" "METHOD:docs/method.md" \
                      "SOURCES:docs/sources.md" "RESULTS:results/SUMMARY.md"; do
            name="${part%%:*}"; path="${part#*:}"
            printf '<<<%s %s>>>\n' "$name" "$path" >> context.txt
            if [ -f "$path" ]; then head -c "$MAX_DOC" "$path" >> context.txt; fi
            printf '\n<<<END %s>>>\n\n' "$name" >> context.txt
          done
          { printf '<<<FILES>>>\n'; cat files.txt; printf '<<<END FILES>>>\n\n<<<DIFF>>>\n'; \
            cat diff.txt; printf '\n<<<END DIFF>>>\n'; } >> context.txt

          jq -n --arg model "$MODEL" --rawfile system prompt.txt --rawfile user context.txt \
            '{model: $model, response_format: {type: "json_object"},
              messages: [{role: "system", content: $system},
                         {role: "user", content: $user}]}' > payload.json

          HTTP_STATUS=$(curl -sS -w "%{http_code}" -o response.json \
            https://api.openai.com/v1/chat/completions \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -d @payload.json)
          if [ "$HTTP_STATUS" -ne 200 ]; then
            echo "The OpenAI API gave the status $HTTP_STATUS:"
            jq -r '.error.message // .' response.json
            exit 1
          fi

          {
            printf '### AI review (%s)\n\n' "$MODEL"
            printf 'A model wrote this comment. It read the diff, the rules, the documents and the result summary. '
            printf 'It cannot run code, read data or open a web page. A program deleted each finding with a quote '
            printf 'that is not in the text. A person must do a check of each finding that stays.\n\n'
            python3 review.py response.json context.txt
          } > comment.md

          # One comment for each pull request: a new push replaces it.
          gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file comment.md --edit-last --create-if-none \
            || gh pr comment "$PR_NUMBER" --repo "$REPO" --body-file comment.md
